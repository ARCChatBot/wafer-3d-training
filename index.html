/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

ge are missing part of their circuit, so they can never work."}},{title:"One die, one chip",text:"One die is one computer chip. This one is about 18 mm on each side, smaller than a postage stamp, yet it holds billions of tiny switches. Chips are cut apart only after every chip on the wafer has been tested.",parts:{DIE:'A die like this one can be a processor, the "brain" of a computer, phone or game console. The photo on its surface is a real processor die.',"SILICON BODY":"Most of the die's thickness is plain silicon. It is there mainly to hold everything up, like the foundation under a building.","WHERE IT WAS PRINTED":"The dark square shows where the die sat on the wafer. In a real factory the wafer stays in one piece until testing is finished; here we lift the die out so you can see it."},q:{ask:"What is a single die?",options:["One complete chip","A whole wafer","One single transistor","The saw that cuts the wafer"],correct:0,why:"Each die is one whole chip. Hundreds of identical dies are printed on one wafer and then cut apart."}},{title:"A chip is built in layers",text:"A chip is built from the bottom up, like a tall building. The transistors, the switches, sit at the bottom, built right into the silicon. Above them are layers of copper wire that connect the switches, and a glass coating on top protects everything.",parts:{PASSIVATION:"A tough, glass-like top layer. It seals the chip so moisture and scratches cannot damage the circuits underneath.","UPPER METAL":"Thick copper wires that carry power and timing signals across the whole chip, like highways. The picture on this layer is a real microscope photo of a chip's top metal.","LOWER METAL":"Thin copper wires that connect switches that are close together, like the streets of a neighbourhood.",CONTACTS:"Tiny metal plugs, usually made of tungsten, that connect the copper wiring down to each transistor.",TRANSISTORS:"The layer where billions of switches are built into the surface of the silicon. Every calculation the chip makes happens here. The picture is a real photo of a die with its metal layers removed.","SILICON SUBSTRATE":"The base of pure silicon that everything is built on. In this view each layer is stretched hundreds of times thicker so you can see it."},q:{ask:"In the stack of layers, where are the transistors?",options:["At the bottom, built into the silicon","In the glass coating on top","Inside the thick copper wires","Outside the chip"],correct:0,why:"Transistors are made first, in the surface of the silicon. All the wiring layers are built on top of them afterwards."}},{title:"Copper wiring",text:"Zoomed in this far, you can see the copper wires. They are stacked in levels that cross at right angles, like roads and overpasses. Vertical links called vias join one level to the next. The finest wires here are about 800 times thinner than a human hair.",parts:{"METAL 4":"The thinnest wiring level shown here: 0.1 micrometres wide. Lower levels are finer because they connect switches that sit right next to each other.","METAL 5":"This level runs at right angles to the one below it. Alternating directions lets wires cross without touching.","METAL 6":"Wider wires carry signals farther across the chip. Wider wires have less electrical resistance, so signals lose less energy.","METAL 7":"The widest level shown, 0.8 micrometres wide. Upper levels carry power to large parts of the chip.",VIA:"A via is a short vertical wire that connects one level to the next, like an elevator shaft connecting the floors of a building.",CONTACT:"This contact leads down to a transistor. That is where we zoom next."},q:{ask:"What does a via do?",options:["It connects one wiring level to the next","It stores electricity like a battery","It cools the chip down","It cuts the wafer into chips"],correct:0,why:"Vias are the vertical connections between wiring levels, like elevators between the floors of a building."}},{title:"A transistor is a switch",text:"A transistor is an electric switc .tr-veil{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(250,251,253,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:Inter,system-ui,sans-serif;color:#0B0F19;box-sizing:border-box}
.tr-veil[hidden]{display:none}
.tr-card{width:min(460px,100%);max-height:calc(100% - 8px);overflow:auto;background:#fff;border:1px solid #E0E5EC;border-radius:10px;box-shadow:0 18px 50px rgba(11,15,25,.18);padding:26px 26px 22px;box-sizing:border-box}
.tr-card.wide{width:min(820px,100%)}
.tr-eye{font:700 10.5px 'JetBrains Mono',monospace;letter-spacing:1.8px;color:#00358E;text-transform:uppercase;margin:0 0 8px}
.tr-card h2{margin:0 0 8px;font-size:22px;line-height:1.2;letter-spacing:-.3px;text-wrap:balance}
.tr-card p{margin:0 0 16px;font-size:14px;line-height:1.5;color:#53617A}
.tr-card label{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:1.4px;color:#53617A;text-transform:uppercase;margin:0 0 6px}
.tr-card input{width:100%;box-sizing:border-box;height:42px;border:1px solid #E0E5EC;border-radius:6px;padding:0 12px;font:500 15px Inter,system-ui,sans-serif;color:#0B0F19;background:#fff;margin:0 0 6px}
.tr-card input:focus{outline:2px solid #00358E;outline-offset:1px;border-color:#00358E}
.tr-hint{font-size:12px;color:#53617A;margin:0 0 14px}
.tr-err{font-size:12.5px;color:#b3261e;min-height:18px;margin:0 0 8px}
.tr-btn{width:100%;height:44px;border:0;border-radius:6px;background:#00358E;color:#fff;font:700 12px 'JetBrains Mono',monospace;letter-spacing:1.6px;cursor:pointer}
.tr-btn.ghost{background:#fff;color:#0B0F19;border:1px solid #E0E5EC}
.tr-btn:focus-visible,.tr-opt:focus-visible{outline:2px solid #0B0F19;outline-offset:2px}
.tr-row{display:flex;gap:10px}
.tr-row .tr-btn{flex:1}
.tr-opts{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.tr-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid #E0E5EC;border-radius:6px;background:#fff;padding:11px 12px;font:500 14px/1.4 Inter,system-ui,sans-serif;color:#0B0F19;cursor:pointer}
.tr-opt b{flex:none;font:700 11px 'JetBrains Mono',monospace;color:#53617A;padding-top:2px}
.tr-opt:hover:not(:disabled){border-color:#00358E}
.tr-opt:disabled{cursor:default;opacity:.55}
.tr-opt.right{border-color:#2f9e6b;background:#eaf7f0;opacity:1}
.tr-opt.wrong{border-color:#b3261e;background:#fbeceb}
.tr-fb{font-size:14px;line-height:1.5;border-radius:6px;padding:10px 12px;margin:0 0 14px}
.tr-fb[hidden]{display:none}
.tr-fb.ok{background:#eaf7f0;color:#1d6b46}
.tr-fb.no{background:#fbeceb;color:#8c1d16}
.tr-done .tr-big{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.1;margin:0 0 14px}
.tr-rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px}
.tr-rows dt{font:600 10px 'JetBrains Mono',monospace;letter-spacing:1.3px;color:#53617A;text-transform:uppercase;padding-top:3px}
.tr-rows dd{margin:0;font-weight:600}
.tr-stops{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.tr-stops li{font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:1.1px;padding:4px 8px;border-radius:4px;background:#e9f6ef;color:#1f7a50}
.tr-stops li.retry{background:#fdf1e6;color:#9a4b12}
.tr-rec{font-size:13px;line-height:1.45;padding:9px 12px;border-radius:6px;margin:0 0 16px;background:#FAFBFD;color:#53617A}
.tr-rec.ok{background:#eaf7f0;color:#1d6b46}
.tr-rec.no{background:#fbeceb;color:#8c1d16}
.tr-table-wrap{overflow:auto;max-height:52vh;border:1px solid #E0E5EC;border-radius:6px;margin:0 0 14px}
.tr-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tr-table th{position:sticky;top:0;background:#FAFBFD;text-align:left;font:600 10px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:#53617A;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid #E0E5EC}
.tr-table td{padding:9px 10px;border-bottom:1px solid #E0E5EC;white-space:nowrap}
.tr-chip{position:absolute;left:800px;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:22px;padding:0 11px;border:1px solid #E0E5EC;border-radius:4px;background:rgba(255,255,255,.96);font:700 9px 'JetBrains Mono',monospace;letter-spacing:1.2px;color:#0B0F19;white-space:nowrap;pointer-events:none}
.tr-chip[hidden]{display:none}
.tr-chip b{color:#FF6700;font-weight:700}
.tr-quiz{position:absolute;left:42px;top:712px;width:254px;height:36px;border:0;border-radius:5px;background:#00358E;color:#fff;font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.4px;cursor:pointer;pointer-events:auto}
.tr-quiz.done{background:#eaf7f0;color:#1d6b46;border:1px solid #bfe3cf}
.tr-quiz.pulse{animation:trpulse 1.4s ease-in-out infinite}
@keyframes trpulse{50%{box-shadow:0 0 0 6px rgba(0,53,142,.22)}}
@media (prefers-reduced-motion: reduce){.tr-quiz.pulse{animation:none}}
.tr-recbtn{position:absolute;left:1290px;top:744px;width:282px;height:34px;border:1px solid #E0E5EC;border-radius:5px;background:#fff;color:#0B0F19;font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:1.3px;cursor:pointer;pointer-events:auto}
.tr-recbtn[hidden]{display:none}
.tr-toast{position:absolute;left:800px;top:104px;transform:translateX(-50%);max-width:620px;padding:8px 14px;border-radius:5px;background:#0B0F19;color:#fff;font:600 12px/1.4 Inter,system-ui,sans-serif;pointer-events:none;opacity:0;transition:opacity .25s;z-index:45;text-align:center}
.tr-toast.on{opacity:1}
.tr-btn[hidden]{display:none}
.tr-table td button{height:28px;padding:0 10px;border:1px solid #E0E5EC;border-radius:4px;background:#fff;font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:1px;cursor:pointer}

html,body{margin:0;height:100%;background:#FAFBFD;overflow:hidden;color-scheme:light}
#app{position:absolute!important;inset:auto!important;left:0;top:0;width:${Hr}px;height:${Vr}px;transform-origin:0 0}
#gl{touch-action:none;cursor:grab;position:absolute;left:0;top:0;width:${Hr}px!important;height:${Vr}px!important}
#gl.drag{cursor:grabbing}
.bt{pointer-events:auto;cursor:pointer}
.bt:hover{filter:brightness(.97)}
.hit{position:absolute;pointer-events:auto;cursor:ew-resize}
.tourchip{position:absolute;left:800px;top:104px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;height:22px;padding:0 11px;border:1px solid #E0E5EC;border-radius:4px;background:rgba(255,255,255,.96);color:#0B0F19;font:700 9px 'JetBrains Mono',monospace;letter-spacing:1.3px;white-space:nowrap;cursor:pointer;pointer-events:auto}

.tourchip.on i{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion: reduce){.tourchip.on i{animation:none}}
